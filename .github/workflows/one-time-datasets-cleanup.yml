name: One-time Datasets Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-datasets-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean datasets documentation without touching image corpora
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Apply datasets documentation cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          old_card = root / 'DATASET_CARD.md'
          new_card = root / 'datasets' / 'DATASET_CARD.md'
          state_file = root / 'datasets' / 'final' / 'reports' / 'manual_selection_state.json'
          workflow = root / '.github' / 'workflows' / 'one-time-datasets-cleanup.yml'

          if not old_card.exists():
              raise SystemExit('Expected DATASET_CARD.md at repository root.')
          if new_card.exists():
              raise SystemExit('datasets/DATASET_CARD.md already exists.')

          card = old_card.read_text(encoding='utf-8')
          card = card.replace(
              'datasets/final/reports/manual_selection_state.json\n',
              '',
          )
          citation = '''## Citation

          Citation metadata for the repository and the thesis are maintained in
          [`CITATION.cff`](../CITATION.cff).

          When referring to the dataset, methodology, or results, cite the repository
          and the corresponding MSc thesis.
          '''
          card = re.sub(r'## Citation\n.*\Z', citation, card, flags=re.S)
          new_card.write_text(card.rstrip() + '\n', encoding='utf-8')
          old_card.unlink()

          datasets_readme = '''# Datasets

          This directory contains the data pipeline and traceability artifacts used by
          the frozen thesis experiments. The workflow combines automated technical
          validation with a documented human-in-the-loop semantic review.

          The canonical dataset description is provided in
          [`DATASET_CARD.md`](DATASET_CARD.md). Data-distribution constraints and the
          controlled restoration procedure are documented in
          [`../DATA_ACCESS.md`](../DATA_ACCESS.md).

          ## Structure

          ```text
          datasets/
          ├── DATASET_CARD.md
          ├── raw/
          ├── prepared/
          │   ├── final_pool/
          │   └── manifests/
          ├── final/
          │   ├── manifests/
          │   └── reports/
          ├── splits/
          │   ├── clean/
          │   ├── ood/
          │   └── manifests/
          ├── forensic_evaluation_bundle/
          │   ├── blind_tool_input/
          │   ├── metadata/
          │   └── structured_audit_view/
          └── scripts/
              ├── acquisition/
              ├── prepared/
              ├── final/
              ├── splits/
              ├── attacks/
              ├── bundle/
              └── utils/
          ```

          The presence or future public removal of image corpora is a separate data
          governance decision. The canonical scripts, manifests, reports, and metadata
          remain the source of truth for the thesis artifact.

          ## Frozen dataset

          The official frozen manifest is:

          ```text
          datasets/final/manifests/manual_selection_final_1500.csv
          ```

          | Evaluation group | Count | Role |
          |---|---:|---|
          | `weapon` | 500 | Positive class for the binary task |
          | `non_weapon` | 500 | Negative class for the binary task |
          | `ood` | 500 | Separate out-of-distribution evaluation layer |
          | **Total** | **1500** | |

          The official binary subset is:

          ```text
          datasets/final/manifests/manual_selection_adversarial_subset.csv
          ```

          It contains 1,000 images: 500 `weapon` and 500 `non_weapon`. OOD images are
          excluded from perturbation generation and evaluated separately.

          ## Canonical artifacts

          | Stage | Canonical artifact |
          |---|---|
          | Prepared pool metadata | `datasets/prepared/final_pool/metadata.csv` |
          | Full review manifest | `datasets/prepared/manifests/review_manifest_full.csv` |
          | Manual review database | `datasets/final/manifests/manual_selection_protocol_db.csv` |
          | Frozen dataset | `datasets/final/manifests/manual_selection_final_1500.csv` |
          | Binary subset | `datasets/final/manifests/manual_selection_adversarial_subset.csv` |
          | Removed samples | `datasets/final/manifests/manual_selection_removed.csv` |
          | Review log | `datasets/final/reports/manual_selection_log.csv` |
          | Review summary | `datasets/final/reports/manual_selection_summary.json` |
          | Clean folds manifest | `datasets/splits/manifests/clean_folds_manifest.csv` |
          | OOD manifest | `datasets/splits/manifests/ood_eval_manifest.csv` |
          | Split summary | `datasets/splits/manifests/split_generation_summary.json` |
          | Bundle manifest | `datasets/forensic_evaluation_bundle/metadata/bundle_manifest.csv` |
          | Bundle hashes | `datasets/forensic_evaluation_bundle/metadata/bundle_hashes_sha256.csv` |
          | Bundle summary | `datasets/forensic_evaluation_bundle/metadata/bundle_summary.json` |

          The GUI session-resume file generated by the manual reviewer is a local
          working artifact and is intentionally not part of the frozen repository.

          ## Official pipeline entry points

          ```text
          00  datasets/scripts/acquisition/00_download_raw_datasets_bundle.py
          01  datasets/scripts/acquisition/01_download_kaggle.py
          02  datasets/scripts/acquisition/02_download_github.py
          03  datasets/scripts/acquisition/03_build_subset_deepfirearm.py
          04  datasets/scripts/acquisition/04_scrape_google.py
          05  datasets/scripts/acquisition/05_scrape_telegram.py
          06  datasets/scripts/acquisition/06_scrape_youtube.py
          07  datasets/scripts/acquisition/07_scrape_deepweb.py
          08  datasets/scripts/prepared/08_build_prepared_dataset.py
          09  datasets/scripts/prepared/09_generate_review_manifest_full.py
          10  datasets/scripts/final/10_manual_selection_protocol_reviewer.py
          11  datasets/scripts/splits/11_generate_clean_and_ood_splits.py
          13  datasets/scripts/attacks/13_generate_anti_forensic_attacks.py
          14  datasets/scripts/attacks/14_generate_adversarial_attacks.py
          16  datasets/scripts/bundle/16_build_forensic_evaluation_bundle.py
          ```

          Scripts 12 and 15 belong respectively to `models/` and `evaluation/`, while
          generated perturbations are stored under `attacks/`.

          ## Split generation

          Five clean binary folds are generated from the frozen 1,000-image subset.
          Each fold contains 200 samples, balanced as 100 `weapon` and 100
          `non_weapon`. The 500 OOD images are maintained as a separate evaluation set.

          The canonical split artifacts are:

          ```text
          datasets/splits/manifests/clean_folds_manifest.csv
          datasets/splits/manifests/ood_eval_manifest.csv
          datasets/splits/manifests/split_generation_summary.json
          ```

          ## Forensic evaluation bundle

          The bundle contains 11,500 inputs:

          | Condition | Files |
          |---|---:|
          | Clean | 1000 |
          | OOD | 500 |
          | Adversarial | 5000 |
          | Anti-forensic | 5000 |
          | **Total** | **11500** |

          For black-box evaluation, only the following directory is intended for tool
          import:

          ```text
          datasets/forensic_evaluation_bundle/blind_tool_input/files/
          ```

          Labels, perturbation attributes, provenance, and hash mappings remain under
          `metadata/` and must not be imported into the evaluated tools. See
          [`forensic_evaluation_bundle/README.md`](forensic_evaluation_bundle/README.md).

          ## Traceability and integrity

          Traceability is based on stable image identifiers, relative paths, source
          metadata, final labels, fold assignments, perturbation manifests, and file
          hashes. SHA256 is the primary integrity mechanism; MD5 is retained only where
          required for forensic-tool interoperability.

          The frozen manifests and generated summaries should not be edited manually.
          Changes to the methodology or dataset composition require regeneration through
          the official scripts and a new documented experimental freeze.
          '''
          (root / 'datasets' / 'README.md').write_text(
              re.sub(r'^          ', '', datasets_readme, flags=re.M).strip() + '\n',
              encoding='utf-8',
          )

          final_readme = '''# Final Dataset

          This directory contains the frozen human-reviewed dataset manifests and the
          audit reports produced by the manual selection protocol.

          For class definitions, intended uses, limitations, and distribution policy,
          see [`../DATASET_CARD.md`](../DATASET_CARD.md).

          ## Canonical manifests

          | Artifact | Purpose |
          |---|---|
          | `manifests/manual_selection_protocol_db.csv` | Review database and semantic assignments |
          | `manifests/manual_selection_final_1500.csv` | Official frozen 1,500-image dataset |
          | `manifests/manual_selection_adversarial_subset.csv` | Official 1,000-image binary subset |
          | `manifests/manual_selection_removed.csv` | Samples excluded from the final selection |

          ## Canonical reports

          | Artifact | Purpose |
          |---|---|
          | `reports/manual_selection_log.csv` | Chronological audit log of review actions |
          | `reports/manual_selection_summary.json` | Final counts, outputs, and consistency checks |

          The GUI session-resume state is generated locally by the reviewer script and
          is intentionally excluded from the frozen repository. It is not a scientific
          result and is not required to verify the final selection.

          ## Frozen composition

          | Group | Count |
          |---|---:|
          | `weapon` | 500 |
          | `non_weapon` | 500 |
          | `ood` | 500 |
          | **Total** | **1500** |

          The adversarial and anti-forensic subset contains 500 `weapon` and 500
          `non_weapon` samples. OOD inputs are evaluated separately and are not used for
          perturbation generation.

          ## Downstream use

          The frozen manifests feed:

          - clean fold generation under `datasets/splits/`;
          - OOD evaluation;
          - adversarial and anti-forensic generation under `attacks/`;
          - proxy-model evaluation;
          - construction of the forensic evaluation bundle.

          Downstream processing must use stable identifiers and hashes rather than
          relying only on filenames. The frozen manifests are immutable for the thesis
          release.
          '''
          (root / 'datasets' / 'final' / 'README.md').write_text(
              re.sub(r'^          ', '', final_readme, flags=re.M).strip() + '\n',
              encoding='utf-8',
          )

          bundle_readme = '''# Forensic Evaluation Bundle

          This directory is the operational bridge between the frozen academic pipeline
          and black-box forensic-tool evaluation.

          The bundle is generated by:

          ```text
          datasets/scripts/bundle/16_build_forensic_evaluation_bundle.py
          ```

          ## Composition

          | Condition | Files |
          |---|---:|
          | Clean binary inputs | 1000 |
          | OOD inputs | 500 |
          | Adversarial inputs | 5000 |
          | Anti-forensic inputs | 5000 |
          | **Total** | **11500** |

          The canonical counts and validation checks are recorded in
          `metadata/bundle_summary.json`.

          ## Directory roles

          ```text
          forensic_evaluation_bundle/
          ├── blind_tool_input/
          │   └── files/
          ├── metadata/
          └── structured_audit_view/
          ```

          ### `blind_tool_input/files/`

          This is the only directory intended for import into the evaluated black-box
          tools. Files use neutral bundle identifiers and a flat layout so that paths do
          not expose labels, OOD status, folds, attack families, attack names, source
          models, or provenance.

          ### `metadata/`

          This directory preserves ground truth and audit information for post-export
          normalization. It must not be imported into the evaluated tools.

          Canonical files include:

          ```text
          metadata/bundle_manifest.csv
          metadata/bundle_hashes_sha256.csv
          metadata/bundle_summary.json
          metadata/embedded_metadata_audit.csv
          metadata/embedded_metadata_audit_summary.json
          ```

          ### `structured_audit_view/`

          This optional internal view preserves a semantic hierarchy for controlled
          audit and debugging. It is not a valid input view for blind tool evaluation.

          ## Bias-control rule

          Tool operators must import only:

          ```text
          datasets/forensic_evaluation_bundle/blind_tool_input/files/
          ```

          They must not import `metadata/` or `structured_audit_view/`. This separation
          reduces path-induced and analyst-induced bias while retaining full hash-based
          traceability for normalization.

          ## Integrity checks

          The bundle-generation summary records checks for:

          - unique bundle identifiers;
          - unique actual SHA256 values;
          - hash agreement with source manifests;
          - semantically neutral blind paths;
          - separation between tool inputs and metadata.

          The embedded-metadata audit is non-destructive. It reports metadata that could
          reveal semantic or experiment-specific information without modifying the image
          files.

          ## Distribution status

          The repository's final policy for retaining or removing the image corpora from
          `main` is handled separately from this documentation cleanup. In either case,
          the metadata, manifests, hashes, scripts, and normalized outputs remain the
          canonical reproducibility record.
          '''
          bundle_path = root / 'datasets' / 'forensic_evaluation_bundle' / 'README.md'
          bundle_path.write_text(
              re.sub(r'^          ', '', bundle_readme, flags=re.M).strip() + '\n',
              encoding='utf-8',
          )

          if state_file.exists():
              state_file.unlink()

          gitignore = root / '.gitignore'
          ignore_text = gitignore.read_text(encoding='utf-8')
          ignore_rule = 'datasets/final/reports/manual_selection_state.json'
          if ignore_rule not in ignore_text:
              ignore_text = ignore_text.rstrip() + (
                  '\n\n# Local manual-review session state\n'
                  + ignore_rule
                  + '\n'
              )
              gitignore.write_text(ignore_text, encoding='utf-8')

          # Update references to the card while preserving already-correct paths.
          excluded = {
              str(new_card),
              'datasets/README.md',
              'datasets/final/README.md',
              str(workflow),
          }
          text_suffixes = {
              '.md', '.tex', '.yml', '.yaml', '.txt', '.ps1', '.cff', '.rst'
          }
          tracked = subprocess.check_output(
              ['git', 'ls-files', '-z'], text=False
          ).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              rel = raw.decode('utf-8')
              if rel in excluded:
                  continue
              path = root / rel
              if path.suffix.lower() not in text_suffixes or not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='strict')
              updated = re.sub(
                  r'(?<!datasets/)DATASET_CARD\.md',
                  'datasets/DATASET_CARD.md',
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # The one-time workflow must not remain in the final tree.
          workflow.unlink()

      - name: Validate datasets cleanup
        shell: bash
        run: |
          set -euo pipefail

          test -f datasets/DATASET_CARD.md
          test ! -e DATASET_CARD.md
          test -f datasets/forensic_evaluation_bundle/README.md
          test ! -e datasets/final/reports/manual_selection_state.json

          python - <<'PY'
          import json
          import py_compile
          import subprocess
          from pathlib import Path

          required = [
              'datasets/README.md',
              'datasets/DATASET_CARD.md',
              'datasets/final/README.md',
              'datasets/forensic_evaluation_bundle/README.md',
              'datasets/final/manifests/manual_selection_protocol_db.csv',
              'datasets/final/manifests/manual_selection_final_1500.csv',
              'datasets/final/manifests/manual_selection_adversarial_subset.csv',
              'datasets/final/manifests/manual_selection_removed.csv',
              'datasets/final/reports/manual_selection_log.csv',
              'datasets/final/reports/manual_selection_summary.json',
              'datasets/splits/manifests/clean_folds_manifest.csv',
              'datasets/splits/manifests/ood_eval_manifest.csv',
              'datasets/splits/manifests/split_generation_summary.json',
              'datasets/forensic_evaluation_bundle/metadata/bundle_manifest.csv',
              'datasets/forensic_evaluation_bundle/metadata/bundle_hashes_sha256.csv',
              'datasets/forensic_evaluation_bundle/metadata/bundle_summary.json',
          ]
          missing = [item for item in required if not Path(item).exists()]
          if missing:
              raise SystemExit(f'Missing canonical dataset artifacts: {missing}')

          for item in [
              'datasets/final/reports/manual_selection_summary.json',
              'datasets/splits/manifests/split_generation_summary.json',
              'datasets/forensic_evaluation_bundle/metadata/bundle_summary.json',
              'datasets/forensic_evaluation_bundle/metadata/embedded_metadata_audit_summary.json',
          ]:
              json.loads(Path(item).read_text(encoding='utf-8'))

          scripts = sorted(Path('datasets/scripts').rglob('*.py'))
          if not scripts:
              raise SystemExit('No dataset scripts found.')
          for script in scripts:
              py_compile.compile(str(script), doraise=True)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True
          ).splitlines()
          image_suffixes = {
              '.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff', '.gif'
          }
          protected_prefixes = (
              'datasets/raw/',
              'datasets/prepared/final_pool/images/',
              'datasets/splits/clean/',
              'datasets/splits/ood/',
              'datasets/forensic_evaluation_bundle/blind_tool_input/',
              'datasets/forensic_evaluation_bundle/structured_audit_view/',
          )
          forbidden = [
              item for item in changed
              if Path(item).suffix.lower() in image_suffixes
              or item.startswith(protected_prefixes)
          ]
          if forbidden:
              raise SystemExit(f'Image corpus files were unexpectedly modified: {forbidden}')

          if '.gitattributes' in changed:
              raise SystemExit('.gitattributes must not be modified in this phase.')

          card = Path('datasets/DATASET_CARD.md').read_text(encoding='utf-8')
          if 'Citation details will be added upon thesis completion' in card:
              raise SystemExit('Stale citation placeholder remains in Dataset Card.')

          print('Datasets cleanup validation passed.')
          print('Changed files:')
          for item in changed:
              print(f' - {item}')
          PY

          git diff --check

      - name: Commit datasets cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: streamline datasets artifact documentation'
          git push origin HEAD:main
