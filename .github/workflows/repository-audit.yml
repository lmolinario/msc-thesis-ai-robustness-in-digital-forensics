name: Repository Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    name: Lightweight repository audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required research-artifact files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              'README.md',
              'THESIS_ARTIFACT.md',
              'REPOSITORY_MAP.md',
              'ARTIFACT_EVALUATION.md',
              'DATA_DICTIONARY.md',
              'ENVIRONMENT.md',
              'RELEASE_CHECKLIST.md',
              'CHANGELOG.md',
              'CITATION.cff',
              'DATA_ACCESS.md',
              '.github/SECURITY.md',
              'REPRODUCIBILITY.md',
              'ACADEMIC_REPOSITORY_AUDIT.md',
              'requirements.txt',
              'LICENSE',
              'docs/README.md',
              'docs/artifact/ARCHIVE_SNAPSHOT.md',
              'docs/LatexThesis/README.md',
              'docs/LatexThesis/main.tex',
              'docs/LatexThesis_ITA/README.md',
              'docs/LatexThesis_ITA/main.tex',
              'evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py',
              'evaluation/forensic_tools/normalized_predictions.csv',
              'evaluation/forensic_tools/normalized_predictions_public_summary.json',
              'forensic_tools/run_registry.json',
              'forensic_tools/public_extracts_validation.json',
              'forensic_tools/scripts/build_canonical_normalized_predictions.py',
              'results/scripts/20_generate_experimental_reporting_assets.py',
              'results/scripts/21_generate_embedded_metadata_sensitivity_check.py',
              'results/scripts/23_validate_results_artifacts.py',
              'results/scripts/24_audit_reporting_asset_usage.py',
          ]

          missing = [path for path in required if not Path(path).exists()]
          if missing:
              print('Missing required files:')
              for path in missing:
                  print(f'  - {path}')
              raise SystemExit(1)

          print('Required research-artifact files are present.')
          PY

      - name: Check selected JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selected = [
              'datasets/splits/manifests/split_generation_summary.json',
              'datasets/forensic_evaluation_bundle/metadata/bundle_summary.json',
              'evaluation/forensic_tools/normalization_summary.json',
              'evaluation/forensic_tools/normalized_predictions_public_summary.json',
              'forensic_tools/run_registry.json',
              'forensic_tools/public_extracts_summary.json',
              'forensic_tools/public_extracts_validation.json',
              'models/model_registry.json',
              'results/metrics/proxy_model_evaluation_summary.json',
              'results/figures/chapter_5/chapter5_figures_summary.json',
              'results/figures/chapter_5/embedded_metadata_sensitivity_summary.json',
          ]

          failed = False
          for item in selected:
              path = Path(item)
              if not path.exists():
                  print(f'SKIP missing optional JSON: {path}')
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'OK  {path}')
              except Exception as exc:
                  failed = True
                  print(f'FAIL {path}: {exc}')

          if failed:
              raise SystemExit(1)
          PY

      - name: Check Python syntax for official entry points
        shell: bash
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path

          scripts = [
              'datasets/scripts/acquisition/00_download_raw_datasets_bundle.py',
              'datasets/scripts/acquisition/01_download_kaggle.py',
              'datasets/scripts/acquisition/02_download_github.py',
              'datasets/scripts/acquisition/03_build_subset_deepfirearm.py',
              'datasets/scripts/acquisition/04_scrape_google.py',
              'datasets/scripts/acquisition/05_scrape_telegram.py',
              'datasets/scripts/acquisition/06_scrape_youtube.py',
              'datasets/scripts/acquisition/07_scrape_deepweb.py',
              'datasets/scripts/prepared/08_build_prepared_dataset.py',
              'datasets/scripts/prepared/09_generate_review_manifest_full.py',
              'datasets/scripts/final/10_manual_selection_protocol_reviewer.py',
              'datasets/scripts/splits/11_generate_clean_and_ood_splits.py',
              'models/scripts/12_train_proxy_models.py',
              'datasets/scripts/attacks/13_generate_anti_forensic_attacks.py',
              'datasets/scripts/attacks/14_generate_adversarial_attacks.py',
              'evaluation/scripts/15_evaluate_proxy_models.py',
              'datasets/scripts/bundle/16_build_forensic_evaluation_bundle.py',
              'explainability/scripts/17_generate_integrated_gradients_case_studies.py',
              'explainability/scripts/18_xai_interactive_launcher.py',
              'evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py',
              'forensic_tools/scripts/build_public_tool_extracts.py',
              'forensic_tools/scripts/build_canonical_normalized_predictions.py',
              'forensic_tools/scripts/validate_public_extract_equivalence.py',
              'results/scripts/20_generate_experimental_reporting_assets.py',
              'results/scripts/21_generate_embedded_metadata_sensitivity_check.py',
              'results/scripts/22_generate_public_embedded_metadata_sensitivity_check.py',
              'results/scripts/23_validate_results_artifacts.py',
              'results/scripts/24_audit_reporting_asset_usage.py',
              'explainability/scripts/sync_chapter5_xai_metadata.py',
              'explainability/scripts/validate_chapter5_xai_artifacts.py',
          ]

          failed = False
          for item in scripts:
              path = Path(item)
              if not path.exists():
                  failed = True
                  print(f'MISSING {path}')
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
                  print(f'OK      {path}')
              except Exception as exc:
                  failed = True
                  print(f'FAIL    {path}: {exc}')

          if failed:
              raise SystemExit(1)
          PY

      - name: Check canonical commercial prediction profile
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          csv_path = Path('evaluation/forensic_tools/normalized_predictions.csv')
          summary_path = Path('evaluation/forensic_tools/normalized_predictions_public_summary.json')
          validation_path = Path('forensic_tools/public_extracts_validation.json')
          metrics_path = Path('results/metrics/forensic_tools_metrics.csv')

          expected = {
              'magnet_axiom': 11500,
              'excire_foto_2025_d20': 11500,
              'excire_foto_2025_d50': 11500,
              'excire_foto_2025_d80': 11500,
              'cellebrite_inseyets': 11500,
              'griffeye': 11500,
          }

          digest = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          with csv_path.open(newline='', encoding='utf-8-sig') as stream:
              reader = csv.DictReader(stream)
              rows = list(reader)
              fields = set(reader.fieldnames or [])

          required = {
              'tool_name', 'bundle_id', 'matched', 'sample_type',
              'attack_family', 'attack_name', 'final_label',
              'weapon_detected', 'normalized_prediction',
          }
          forbidden = {
              'raw_export_file', 'raw_filename_or_path', 'raw_row_number',
              'sha256', 'md5', 'metadata_json', 'tool_input_filename',
          }
          if required - fields:
              raise SystemExit(f'Missing canonical columns: {sorted(required - fields)}')
          if forbidden & fields:
              raise SystemExit(f'Forbidden canonical columns: {sorted(forbidden & fields)}')
          if len(rows) != 69000:
              raise SystemExit(f'Expected 69000 canonical rows, found {len(rows)}')

          counts = Counter(row['tool_name'] for row in rows)
          if dict(counts) != expected:
              raise SystemExit(f'Canonical profile mismatch: {dict(counts)}')
          keys = [(row['tool_name'], row['bundle_id']) for row in rows]
          if len(keys) != len(set(keys)):
              raise SystemExit('Duplicate tool_name/bundle_id pairs detected')

          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          validation = json.loads(validation_path.read_text(encoding='utf-8'))
          if summary['output']['rows'] != 69000 or summary['output']['sha256'] != digest:
              raise SystemExit('Canonical summary does not match the committed CSV')
          if validation.get('source_sha256') != digest:
              raise SystemExit('Equivalence report does not match the canonical CSV')
          if not validation.get('decisions_identical') or not validation.get('metrics_identical'):
              raise SystemExit('Equivalence status is not fully passed')

          with metrics_path.open(newline='', encoding='utf-8-sig') as stream:
              metric_rows = list(csv.DictReader(stream))
          if len(metric_rows) != 186:
              raise SystemExit(f'Expected 186 commercial metric rows, found {len(metric_rows)}')

          print('Canonical prediction and commercial metric profile passed.')
          PY

      - name: Check stale final-documentation patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patterns = [
              '/run/media/lello',
              'X-Ways',
              'Oxygen Forensic Detective',
              'Autopsy',
              'explainability/outputs/integrated_gradients/',
          ]

          checked_paths = [
              Path('README.md'),
              Path('THESIS_ARTIFACT.md'),
              Path('REPOSITORY_MAP.md'),
              Path('ARTIFACT_EVALUATION.md'),
              Path('DATA_DICTIONARY.md'),
              Path('ENVIRONMENT.md'),
              Path('RELEASE_CHECKLIST.md'),
              Path('CHANGELOG.md'),
              Path('REPRODUCIBILITY.md'),
              Path('DATA_ACCESS.md'),
              Path('.github/SECURITY.md'),
              Path('docs/README.md'),
              Path('docs/LatexThesis/README.md'),
              Path('docs/LatexThesis_ITA/README.md'),
              Path('datasets/README.md'),
              Path('attacks/README.md'),
              Path('evaluation/README.md'),
              Path('forensic_tools/README.md'),
              Path('results/README.md'),
              Path('results/scripts/README.md'),
              Path('explainability/README.md'),
          ]

          failed = False
          for path in checked_paths:
              if not path.exists():
                  print(f'SKIP missing optional documentation file: {path}')
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for pattern in patterns:
                  if pattern in text:
                      failed = True
                      print(f'Forbidden or stale pattern {pattern!r} found in {path}')

          if failed:
              raise SystemExit(1)
          print('Final-documentation text guard check passed.')
          PY
