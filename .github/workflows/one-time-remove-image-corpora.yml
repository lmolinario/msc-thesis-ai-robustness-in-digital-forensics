name: One-time Remove Image Corpora

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-remove-image-corpora.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Remove tracked image corpora
        shell: bash
        run: |
          set -euo pipefail

          git rm -r --ignore-unmatch -- \
            datasets/raw \
            datasets/prepared/final_pool/images \
            datasets/splits/clean \
            datasets/splits/ood \
            datasets/forensic_evaluation_bundle/blind_tool_input \
            datasets/forensic_evaluation_bundle/structured_audit_view \
            attacks/adversarial/color_shift \
            attacks/adversarial/fgsm \
            attacks/adversarial/one_pixel \
            attacks/adversarial/sigma_zero \
            attacks/adversarial/superdeepfool \
            attacks/anti_forensic/jpeg_recompression \
            attacks/anti_forensic/resample_resize \
            attacks/anti_forensic/gaussian_blur \
            attacks/anti_forensic/histogram_modification \
            attacks/anti_forensic/contrast_stretching

          mkdir -p datasets/raw
          cat > datasets/raw/README.md <<'EOF'
          # Raw Dataset Restoration

          Raw image corpora are intentionally not tracked on the `main` branch.

          Restore the externally hosted raw bundle with:

          ```bash
          python datasets/scripts/acquisition/00_download_raw_datasets_bundle.py
          ```

          Downloaded and extracted data remain local and are ignored by Git. Prepared
          images, clean/OOD splits, perturbations, and the forensic evaluation bundle must
          be regenerated through the numbered pipeline.
          EOF
          sed -i 's/^          //' datasets/raw/README.md

          rm .github/workflows/one-time-remove-image-corpora.yml
          git add -A

          python - <<'PY'
          import subprocess

          allowed_exact = {
              '.github/workflows/one-time-remove-image-corpora.yml',
              'datasets/raw/README.md',
          }
          allowed_prefixes = (
              'datasets/raw/',
              'datasets/prepared/final_pool/images/',
              'datasets/splits/clean/',
              'datasets/splits/ood/',
              'datasets/forensic_evaluation_bundle/blind_tool_input/',
              'datasets/forensic_evaluation_bundle/structured_audit_view/',
              'attacks/adversarial/color_shift/',
              'attacks/adversarial/fgsm/',
              'attacks/adversarial/one_pixel/',
              'attacks/adversarial/sigma_zero/',
              'attacks/adversarial/superdeepfool/',
              'attacks/anti_forensic/jpeg_recompression/',
              'attacks/anti_forensic/resample_resize/',
              'attacks/anti_forensic/gaussian_blur/',
              'attacks/anti_forensic/histogram_modification/',
              'attacks/anti_forensic/contrast_stretching/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit('Unexpected paths:\n' + '\n'.join(unexpected))
          if len(changed) < 1000:
              raise SystemExit(f'Unexpectedly low removal count: {len(changed)} changed paths')
          print(f'Validated {len(changed)} corpus-removal changes.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: remove image corpora from main"
          git push origin main
