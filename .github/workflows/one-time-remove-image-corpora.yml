      - name: Guard allowed change scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import subprocess

          exact_allowed = {
              '.github/workflows/one-time-remove-image-corpora.yml',
              '.github/workflows/repository-audit.yml',
              '.gitignore',
              '.env.example',
              'README.md',
              'DATA_ACCESS.md',
              'REPRODUCIBILITY.md',
              'datasets/README.md',
              'datasets/DATASET_CARD.md',
              'datasets/raw/README.md',
              'datasets/forensic_evaluation_bundle/README.md',
              'datasets/scripts/acquisition/00_download_raw_datasets_bundle.py',
              'attacks/README.md',
          }
          allowed_prefixes = (
              'datasets/raw/',
              'datasets/prepared/final_pool/images/',
              'datasets/splits/clean/',
              'datasets/splits/ood/',
              'datasets/forensic_evaluation_bundle/blind_tool_input/',
              'datasets/forensic_evaluation_bundle/structured_audit_view/',
              'attacks/adversarial/color_shift/',
              'attacks/adversarial/fgsm/',
              'attacks/adversarial/one_pixel/',
              'attacks/adversarial/sigma_zero/',
              'attacks/adversarial/superdeepfool/',
              'attacks/anti_forensic/jpeg_recompression/',
              'attacks/anti_forensic/resample_resize/',
              'attacks/anti_forensic/gaussian_blur/',
              'attacks/anti_forensic/histogram_modification/',
              'attacks/anti_forensic/contrast_stretching/',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if path not in exact_allowed and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit('Unexpected changed paths:\n' + '\n'.join(unexpected))
          print(f'Allowed change-scope guard passed for {len(changed)} paths.')
          PY

