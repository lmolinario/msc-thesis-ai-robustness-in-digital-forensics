name: Normalize thesis caption punctuation

on:
  push:
    branches:
      - thesis/final-review-corrections
    paths:
      - .github/workflows/normalize-thesis-caption-punctuation.yml

permissions:
  contents: write

jobs:
  normalize-captions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: thesis/final-review-corrections
          fetch-depth: 0

      - name: Normalize caption punctuation
        run: python tools/maintenance/normalize_thesis_caption_punctuation.py

      - name: Remove temporary automation and validate diff
        shell: bash
        run: |
          rm tools/maintenance/normalize_thesis_caption_punctuation.py
          rm .github/workflows/normalize-thesis-caption-punctuation.yml
          git diff --check
          git status --short

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LatexThesis/sections/02_background.tex \
            docs/LatexThesis/sections/03_StateoftheArt.tex \
            docs/LatexThesis/sections/08_appendix.tex \
            tools/maintenance/normalize_thesis_caption_punctuation.py \
            .github/workflows/normalize-thesis-caption-punctuation.yml
          git commit -m "docs: normalize thesis caption punctuation"
          git push origin HEAD:thesis/final-review-corrections
