name: One-time Attacks Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-attacks-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean attack documentation and strict JSON artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Apply attacks cleanup
        shell: python
        run: |
          from __future__ import annotations

          import csv
          import json
          import math
          from pathlib import Path

          root = Path('.')
          workflow = root / '.github/workflows/one-time-attacks-cleanup.yml'
          manifests_dir = root / 'attacks/manifests'
          script_path = root / 'datasets/scripts/attacks/14_generate_adversarial_attacks.py'

          attacks_readme = '''# Attacks

          This directory contains the frozen adversarial and anti-forensic artifacts used
          to evaluate the operational robustness of image-classification systems in the
          thesis.

          Perturbations are generated only from the official 1,000-image binary subset:

          ```text
          datasets/final/manifests/manual_selection_adversarial_subset.csv
          datasets/splits/manifests/clean_folds_manifest.csv
          ```

          The 500 OOD samples remain clean and are evaluated separately.

          ## Structure

          ```text
          attacks/
          ├── adversarial/
          │   ├── color_shift/
          │   ├── fgsm/
          │   ├── one_pixel/
          │   ├── sigma_zero/
          │   └── superdeepfool/
          ├── anti_forensic/
          │   ├── jpeg_recompression/
          │   ├── resample_resize/
          │   ├── gaussian_blur/
          │   ├── histogram_modification/
          │   └── contrast_stretching/
          └── manifests/
          ```

          ## Frozen composition

          | Family | Variants | Inputs per variant | Generated files |
          |---|---:|---:|---:|
          | Adversarial / adversarial-style | 5 | 1000 | 5000 |
          | Anti-forensic | 5 | 1000 | 5000 |
          | **Total** | **10** |  | **10000** |

          All variants preserve the five-fold structure and the balanced binary labels:
          500 `weapon` and 500 `non_weapon` inputs per variant.

          ## Methodological distinction

          **Adversarial attacks** use transparent proxy models to generate controlled
          perturbations. FGSM, One Pixel, Sigma-Zero, and SuperDeepFool are
          model-dependent and use fold-aware EfficientNet-B0 checkpoints. Color Shift is
          model-agnostic and is retained in the adversarial family as an
          adversarial-style robustness stressor.

          **Anti-forensic transformations** are model-agnostic image-processing
          operations intended to simulate realistic manipulations that may occur before
          forensic acquisition or automated triage.

          ## Official generation scripts

          ```text
          datasets/scripts/attacks/13_generate_anti_forensic_attacks.py
          datasets/scripts/attacks/14_generate_adversarial_attacks.py
          ```

          The scripts validate clean-input hashes, preserve fold assignments, generate
          stable identifiers, and record output hashes and transformation parameters.

          ## Fold-aware rule

          For every sample in fold `F`, a model-dependent attack uses:

          ```text
          models/checkpoints/<target_model>/F.pt
          ```

          The corresponding checkpoint was trained on the other four folds, preventing
          the attacked image from appearing in the target model's training partition.

          ## Canonical records

          Sample-level traceability and generation summaries are stored under
          [`manifests/`](manifests/). CSV manifests are the source of truth for mappings
          between clean and perturbed files; JSON summaries contain aggregate generation
          counts and validation checks.

          Detailed documentation:

          - [`adversarial/README.md`](adversarial/README.md)
          - [`anti_forensic/README.md`](anti_forensic/README.md)
          - [`manifests/README.md`](manifests/README.md)

          ## Distribution status

          The final decision on retaining or removing generated image files from `main`
          is handled together with the dataset-image distribution policy. Regardless of
          that decision, scripts, manifests, hashes, summaries, normalized predictions,
          and metrics remain the canonical reproducibility record.
          '''

          adversarial_readme = '''# Adversarial Attacks

          This directory contains the adversarial and adversarial-style perturbations
          generated from the frozen 1,000-image binary subset.

          ## Threat model

          The protocol adopts a proxy-based limited-knowledge setting. Transparent local
          models are used to generate or evaluate perturbations, while commercial tools
          are evaluated separately as operational black boxes.

          The primary generation target is:

          ```text
          efficientnet_b0
          ```

          ResNet18 and CLIP are used as transfer/evaluation targets in the proxy-model
          evaluation stage.

          ## Frozen attack set

          | Attack | Type | Dependency | Frozen role |
          |---|---|---|---|
          | `fgsm` | gradient-based, untargeted | model-dependent | white-box baseline |
          | `one_pixel` | score-based sparse attack | model-dependent | localized stress test |
          | `sigma_zero` | sparse optimization attack | model-dependent | high-impact L0-oriented stressor |
          | `superdeepfool` | iterative decision-boundary attack | model-dependent | stronger boundary-oriented stressor |
          | `color_shift` | image transformation | model-agnostic | adversarial-style color robustness stressor |

          Color Shift is not a gradient-based adversarial example. It remains under
          `attacks/adversarial/` because it was frozen as one of the five adversarial-side
          variants used by the bundle, evaluation scripts, and thesis reporting.

          ## Fold-aware checkpoint protocol

          For an image belonging to fold `F`, every model-dependent attack uses:

          ```text
          models/checkpoints/<target_model>/F.pt
          ```

          The checkpoint is trained on the other four folds and never on the attacked
          sample's fold.

          ## Frozen parameters

          | Attack | Main frozen configuration |
          |---|---|
          | FGSM | epsilon `8/255`, untargeted, pixel space `[0,1]` |
          | One Pixel | 50 iterations, population-size multiplier 20, seed 42 |
          | Sigma-Zero | 1000 steps, eta 1.0, sigma 0.001, tau 0.3, tau factor 0.01, infinity gradient norm |
          | SuperDeepFool | 20 outer iterations, 50 DeepFool iterations, 1 projection step, `SDF(infinity,1)` |
          | Color Shift | R `+12`, G `0`, B `-12`, saturation `1.10`, contrast `1.00`, JPEG quality 95 |

          Exact run parameters are preserved in the corresponding JSON summaries and in
          each manifest's `attack_parameters` field.

          ## Output format

          Model-dependent outputs are stored as lossless PNG files:

          ```text
          attacks/adversarial/<attack>/<target_model>/<fold>/<label>/<image_id>__<attack>__<target_model>.png
          ```

          Color Shift is stored as JPEG because it is an explicit image-processing
          transformation:

          ```text
          attacks/adversarial/color_shift/model_agnostic/<fold>/<label>/<image_id>__color_shift__model_agnostic.jpg
          ```

          ## Official entry point

          ```text
          datasets/scripts/attacks/14_generate_adversarial_attacks.py
          ```

          General command:

          ```bash
          python datasets/scripts/attacks/14_generate_adversarial_attacks.py \
            --attack <attack_name> \
            --target-model efficientnet_b0 \
            --checkpoint-root models/checkpoints \
            --device auto \
            --force
          ```

          For Color Shift, `--target-model` and `--checkpoint-root` are not operationally
          used. A smoke test can be run by adding `--limit 10`.

          ## Traceability

          Each generated artifact records, at minimum:

          ```text
          generated_image_id
          original_image_id
          fold
          final_label
          clean_relative_path
          perturbed_relative_path
          attack_name
          attack_parameters
          target_model
          model_dependency
          checkpoint_path
          checkpoint_sha256
          sha256_original
          sha256_perturbed
          md5_perturbed
          created_at
          ```

          Manifest CSV files and strict JSON summaries are stored in
          [`../manifests/`](../manifests/).
          '''

          anti_forensic_readme = '''# Anti-Forensic Transformations

          This directory contains controlled image-processing transformations used to
          evaluate robustness under realistic anti-forensic conditions.

          The transformations are model-agnostic and are applied to the official clean
          binary folds. They are not optimization-based adversarial examples.

          ## Frozen transformation set

          | Transformation | Frozen configuration |
          |---|---|
          | `jpeg_recompression` | JPEG quality 70 |
          | `resample_resize` | scale 0.5, bicubic downsampling and restoration to the original dimensions |
          | `gaussian_blur` | Gaussian radius 1.5 |
          | `histogram_modification` | histogram equalization |
          | `contrast_stretching` | autocontrast cutoff 1% |

          Non-recompression outputs are saved as JPEG quality 95 after the selected
          transformation. Exact parameters are preserved in the manifest.

          ## Official entry point

          ```text
          datasets/scripts/attacks/13_generate_anti_forensic_attacks.py
          ```

          Generate the frozen set:

          ```bash
          python datasets/scripts/attacks/13_generate_anti_forensic_attacks.py --force
          ```

          Generate one transformation:

          ```bash
          python datasets/scripts/attacks/13_generate_anti_forensic_attacks.py \
            --attack gaussian_blur \
            --force
          ```

          A smoke test can be run with `--limit 10`.

          ## Output layout

          ```text
          attacks/anti_forensic/<transformation>/<fold>/<label>/<image_id>__<transformation>.jpg
          ```

          The fold and label hierarchy is preserved for controlled evaluation; the blind
          forensic-tool bundle later replaces semantic paths with neutral identifiers.

          ## Traceability

          Each generated artifact records, at minimum:

          ```text
          generated_image_id
          original_image_id
          fold
          final_label
          clean_relative_path
          perturbed_relative_path
          attack_name
          attack_parameters
          sha256_original
          sha256_perturbed
          md5_perturbed
          size_bytes
          created_at
          ```

          Canonical generation records:

          ```text
          attacks/manifests/anti_forensic_attacks_manifest.csv
          attacks/manifests/anti_forensic_generation_summary.json
          ```

          The transformations are evaluated as a separate robustness family from FGSM,
          One Pixel, Sigma-Zero, SuperDeepFool, and the adversarial-style Color Shift
          variant.
          '''

          manifests_readme = '''# Attack Manifests

          This directory contains the frozen sample-level manifests and strict JSON
          generation summaries for the adversarial and anti-forensic stages.

          ## Canonical artifacts

          ### Anti-forensic

          ```text
          anti_forensic_attacks_manifest.csv
          anti_forensic_generation_summary.json
          ```

          ### Adversarial and adversarial-style

          ```text
          adversarial_color_shift_manifest.csv
          adversarial_color_shift_summary.json

          adversarial_fgsm_efficientnet_b0_manifest.csv
          adversarial_fgsm_efficientnet_b0_summary.json

          adversarial_one_pixel_efficientnet_b0_manifest.csv
          adversarial_one_pixel_efficientnet_b0_summary.json

          adversarial_sigma_zero_efficientnet_b0_manifest.csv
          adversarial_sigma_zero_efficientnet_b0_summary.json

          adversarial_superdeepfool_efficientnet_b0_manifest.csv
          adversarial_superdeepfool_efficientnet_b0_summary.json
          ```

          These twelve files are the canonical generation records used by downstream
          evaluation, forensic-bundle construction, and explainability workflows.

          ## Source-of-truth rule

          CSV manifests define sample-level traceability. JSON summaries record run
          parameters, aggregate counts, attack-success summaries where applicable, and
          generation validation checks. A JSON summary does not replace the associated
          CSV manifest when individual clean-to-perturbed mappings are required.

          ## Common traceability fields

          ```text
          generated_image_id
          original_image_id
          fold
          final_label
          source_dataset
          clean_relative_path
          perturbed_relative_path
          attack_family
          attack_name
          attack_parameters
          target_model
          model_dependency
          checkpoint_path
          checkpoint_sha256
          sha256_original
          sha256_perturbed
          md5_perturbed
          created_at
          ```

          Model-specific fields are empty or marked as not applicable for model-agnostic
          transformations.

          ## Integrity expectations

          Frozen summaries verify:

          - the expected number of generated files;
          - uniqueness of generated identifiers;
          - uniqueness of perturbed SHA256 values;
          - successful manifest creation;
          - balanced per-fold and per-label counts.

          JSON files use strict JSON syntax. Non-finite mathematical configuration values
          are represented as strings such as `"inf"`, not as the non-standard token
          `Infinity`.

          ## Evaluation outputs

          Proxy-model predictions and metrics are canonical under `evaluation/` and
          `results/`. Optional evaluation files produced directly by the anti-forensic
          generator are treated as local working outputs and are not part of this frozen
          manifest directory.
          '''

          def dedent(text: str) -> str:
              lines = text.splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines).strip() + '\n'

          (root / 'attacks/README.md').write_text(dedent(attacks_readme), encoding='utf-8')
          (root / 'attacks/adversarial/README.md').write_text(dedent(adversarial_readme), encoding='utf-8')
          (root / 'attacks/anti_forensic/README.md').write_text(dedent(anti_forensic_readme), encoding='utf-8')
          (root / 'attacks/manifests/README.md').write_text(dedent(manifests_readme), encoding='utf-8')

          # Remove auxiliary duplicate evaluation outputs. Canonical evaluation remains
          # under evaluation/ and results/.
          for path in (
              manifests_dir / 'anti_forensic_efficientnet_b0_evaluation.csv',
              manifests_dir / 'anti_forensic_efficientnet_b0_evaluation_summary.json',
          ):
              path.unlink(missing_ok=True)

          # Prevent optional local evaluation outputs from being recommitted.
          gitignore_path = root / '.gitignore'
          gitignore = gitignore_path.read_text(encoding='utf-8')
          block = '''

          # Optional local evaluation outputs from the anti-forensic generator
          attacks/manifests/anti_forensic_*_evaluation.csv
          attacks/manifests/anti_forensic_*_evaluation_summary.json
          '''
          block = dedent(block).rstrip() + '\n'
          if 'attacks/manifests/anti_forensic_*_evaluation.csv' not in gitignore:
              gitignore = gitignore.rstrip() + '\n' + block
              gitignore_path.write_text(gitignore, encoding='utf-8')

          # Make script 14 serialize only standards-compliant JSON and remove a leftover
          # timestamp debug print.
          script = script_path.read_text(encoding='utf-8')
          script = script.replace('import json\nimport logging\n', 'import json\nimport logging\nimport math\n')
          script = script.replace(
              'def safe_str(value: Any) -> str:\n    if pd.isna(value):\n        return ""\n    return str(value).strip()\n\n\n',
              'def safe_str(value: Any) -> str:\n    if pd.isna(value):\n        return ""\n    return str(value).strip()\n\n\ndef json_safe(value: Any) -> Any:\n    """Return a recursively strict-JSON-compatible representation."""\n    if isinstance(value, float) and not math.isfinite(value):\n        if math.isnan(value):\n            return "nan"\n        return "inf" if value > 0 else "-inf"\n    if isinstance(value, dict):\n        return {str(key): json_safe(item) for key, item in value.items()}\n    if isinstance(value, (list, tuple)):\n        return [json_safe(item) for item in value]\n    return value\n\n\n',
          )
          script = script.replace(
              '"attack_parameters": json.dumps(attack_params, sort_keys=True),',
              '"attack_parameters": json.dumps(json_safe(attack_params), sort_keys=True, allow_nan=False),',
          )
          script = script.replace(
              'path.write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8")',
              'path.write_text(\n        json.dumps(json_safe(summary), indent=2, ensure_ascii=False, allow_nan=False),\n        encoding="utf-8",\n    )',
          )
          script = script.replace(
              '    per_attack_counts = Counter(row["attack_name"] for row in rows)\n',
              '    per_attack_counts = Counter(row["attack_name"] for row in rows)\n    has_model_dependent = any(is_model_dependent_attack_local(name) for name in selected_attacks)\n    has_model_agnostic = any(not is_model_dependent_attack_local(name) for name in selected_attacks)\n    effective_target_models = selected_target_models if has_model_dependent else []\n    generation_mode = (\n        "mixed" if has_model_dependent and has_model_agnostic\n        else "model_dependent" if has_model_dependent\n        else "model_agnostic"\n    )\n',
              1,
          )
          script = script.replace(
              '        "selected_target_models": selected_target_models,\n        "checkpoint_root": repo_relative_string(checkpoint_root),\n',
              '        "selected_target_models": effective_target_models,\n        "generation_mode": generation_mode,\n        "checkpoint_root": repo_relative_string(checkpoint_root) if has_model_dependent else "not_applicable",\n',
          )
          script = script.replace(
              '            "device": args.device,\n            "limit": args.limit,\n',
              '            "device": args.device,\n            "limit": args.limit,\n            "color_red_shift": args.color_red_shift,\n            "color_green_shift": args.color_green_shift,\n            "color_blue_shift": args.color_blue_shift,\n            "color_saturation_factor": args.color_saturation_factor,\n            "color_contrast_factor": args.color_contrast_factor,\n',
          )
          script = script.replace(
              'def main() -> None:\n    import datetime\n    print (datetime.datetime.now(datetime.UTC))\n    args = parse_args()\n',
              'def main() -> None:\n    args = parse_args()\n',
          )
          script_path.write_text(script, encoding='utf-8')

          def replace_non_finite(value):
              if isinstance(value, float) and not math.isfinite(value):
                  if math.isnan(value):
                      return 'nan'
                  return 'inf' if value > 0 else '-inf'
              if isinstance(value, dict):
                  return {key: replace_non_finite(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [replace_non_finite(item) for item in value]
              return value

          # Normalize all attack summary JSON files to strict JSON.
          for json_path in sorted(manifests_dir.glob('*.json')):
              raw = json_path.read_text(encoding='utf-8')
              data = json.loads(raw)
              data = replace_non_finite(data)
              if json_path.name == 'adversarial_color_shift_summary.json':
                  data['selected_target_models'] = []
                  data['generation_mode'] = 'model_agnostic'
                  data['checkpoint_root'] = 'not_applicable'
                  params = data.setdefault('parameters', {})
                  params.update({
                      'color_red_shift': 12,
                      'color_green_shift': 0,
                      'color_blue_shift': -12,
                      'color_saturation_factor': 1.10,
                      'color_contrast_factor': 1.00,
                  })
              json_path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False, allow_nan=False) + '\n',
                  encoding='utf-8',
              )

          # Normalize JSON stored in attack_parameters without changing other CSV fields.
          for csv_path in sorted(manifests_dir.glob('*.csv')):
              if '_manifest' not in csv_path.stem:
                  continue
              with csv_path.open('r', newline='', encoding='utf-8') as handle:
                  reader = csv.DictReader(handle)
                  fieldnames = reader.fieldnames
                  rows = list(reader)
              if not fieldnames or 'attack_parameters' not in fieldnames:
                  continue
              changed = False
              for row in rows:
                  raw = row.get('attack_parameters', '')
                  if not raw:
                      continue
                  parsed = json.loads(raw)
                  normalized = json.dumps(
                      replace_non_finite(parsed),
                      sort_keys=True,
                      allow_nan=False,
                  )
                  if normalized != raw:
                      row['attack_parameters'] = normalized
                      changed = True
              if changed:
                  with csv_path.open('w', newline='', encoding='utf-8') as handle:
                      writer = csv.DictWriter(handle, fieldnames=fieldnames)
                      writer.writeheader()
                      writer.writerows(rows)

          workflow.unlink()

      - name: Validate cleanup
        shell: python
        run: |
          from __future__ import annotations

          import csv
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          manifests = root / 'attacks/manifests'

          canonical = [
              'anti_forensic_attacks_manifest.csv',
              'anti_forensic_generation_summary.json',
              'adversarial_color_shift_manifest.csv',
              'adversarial_color_shift_summary.json',
              'adversarial_fgsm_efficientnet_b0_manifest.csv',
              'adversarial_fgsm_efficientnet_b0_summary.json',
              'adversarial_one_pixel_efficientnet_b0_manifest.csv',
              'adversarial_one_pixel_efficientnet_b0_summary.json',
              'adversarial_sigma_zero_efficientnet_b0_manifest.csv',
              'adversarial_sigma_zero_efficientnet_b0_summary.json',
              'adversarial_superdeepfool_efficientnet_b0_manifest.csv',
              'adversarial_superdeepfool_efficientnet_b0_summary.json',
          ]
          missing = [name for name in canonical if not (manifests / name).exists()]
          if missing:
              raise SystemExit(f'Missing canonical attack artifacts: {missing}')

          def reject_constant(value: str):
              raise ValueError(f'Non-standard JSON constant: {value}')

          for path in sorted(manifests.glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'), parse_constant=reject_constant)

          for path in sorted(manifests.glob('*_manifest.csv')):
              with path.open('r', newline='', encoding='utf-8') as handle:
                  for row_number, row in enumerate(csv.DictReader(handle), start=2):
                      raw = row.get('attack_parameters', '')
                      if raw:
                          try:
                              json.loads(raw, parse_constant=reject_constant)
                          except Exception as exc:
                              raise SystemExit(f'{path}:{row_number}: invalid attack_parameters: {exc}')

          for auxiliary in (
              manifests / 'anti_forensic_efficientnet_b0_evaluation.csv',
              manifests / 'anti_forensic_efficientnet_b0_evaluation_summary.json',
          ):
              if auxiliary.exists():
                  raise SystemExit(f'Auxiliary evaluation output still present: {auxiliary}')

          subprocess.run(
              ['python', '-m', 'py_compile', 'datasets/scripts/attacks/14_generate_adversarial_attacks.py'],
              check=True,
          )

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True
          ).splitlines()

          protected_prefixes = (
              'attacks/adversarial/',
              'attacks/anti_forensic/',
              'datasets/raw/',
              'datasets/prepared/final_pool/images/',
              'datasets/splits/clean/',
              'datasets/splits/ood/',
              'datasets/forensic_evaluation_bundle/blind_tool_input/',
              'datasets/forensic_evaluation_bundle/structured_audit_view/',
          )
          protected_readmes = {
              'attacks/adversarial/README.md',
              'attacks/anti_forensic/README.md',
          }
          image_suffixes = {'.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff'}

          for name in changed:
              path = Path(name)
              if path.suffix.lower() in image_suffixes:
                  raise SystemExit(f'Image file unexpectedly changed: {name}')
              if any(name.startswith(prefix) for prefix in protected_prefixes) and name not in protected_readmes:
                  raise SystemExit(f'Protected corpus/output path unexpectedly changed: {name}')

          allowed_exact = {
              '.github/workflows/one-time-attacks-cleanup.yml',
              '.gitignore',
              'attacks/README.md',
              'attacks/adversarial/README.md',
              'attacks/anti_forensic/README.md',
              'attacks/manifests/README.md',
              'datasets/scripts/attacks/14_generate_adversarial_attacks.py',
          }
          for name in changed:
              if name in allowed_exact or name.startswith('attacks/manifests/'):
                  continue
              raise SystemExit(f'Unexpected changed path: {name}')

          print('Attacks cleanup validation passed.')
          print('Changed paths:')
          for name in changed:
              print(f'  - {name}')

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: streamline attacks artifact and strict JSON records"
          git push
