name: Apply final thesis review corrections

on:
  push:
    branches:
      - thesis/final-review-corrections
    paths:
      - .github/workflows/apply-final-review-corrections.yml

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: thesis/final-review-corrections
          fetch-depth: 0

      - name: Apply verified corrections
        run: python tools/maintenance/apply_final_review_corrections.py

      - name: Validate patch and remove temporary automation
        shell: bash
        run: |
          git diff --check
          rm tools/maintenance/apply_final_review_corrections.py
          rm .github/workflows/apply-final-review-corrections.yml
          git status --short

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/artifact/REPRODUCIBILITY.md \
            docs/LatexThesis/sections/02_background.tex \
            docs/LatexThesis/sections/04_methodology.tex \
            docs/LatexThesis/sections/05_implementation.tex \
            docs/LatexThesis/sections/06_results.tex \
            docs/LatexThesis/sections/08_appendix.tex \
            tools/maintenance/apply_final_review_corrections.py \
            .github/workflows/apply-final-review-corrections.yml
          git commit -m "docs: apply remaining final review corrections"
          git push origin HEAD:thesis/final-review-corrections
