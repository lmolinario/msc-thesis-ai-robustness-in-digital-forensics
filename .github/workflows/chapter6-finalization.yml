name: Chapter 6 Finalization

on:
  push:
    branches: [main]
    paths:
      - tools/chapter6_finalization/apply.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Apply, audit, and compile Chapter 6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final Chapter 6 revisions
        run: python tools/chapter6_finalization/apply.py

      - name: Run repository audits
        id: audits
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            bash tools/tasks.sh check-json
            bash tools/tasks.sh check-python-syntax
            bash tools/tasks.sh check-text-guards
            bash tools/tasks.sh check-xai
            bash tools/tasks.sh check-results
            bash tools/tasks.sh check-assets
            bash tools/tasks.sh check-latex-images
          } 2>&1 | tee /tmp/chapter6-audit.log

      - name: Compile complete thesis
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: docs/LatexThesis
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Validate LaTeX log
        id: logcheck
        continue-on-error: true
        shell: bash
        run: |
          test -f docs/LatexThesis/main.log
          if grep -En 'Undefined references|Citation.*undefined|LaTeX Error|Package glossaries Warning' docs/LatexThesis/main.log; then
            exit 1
          fi
          test -f docs/LatexThesis/main.pdf

      - name: Write finalization report
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audits.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          LOGCHECK_OUTCOME: ${{ steps.logcheck.outcome }}
        run: |
          mkdir -p docs/maintenance
          cat > docs/maintenance/CHAPTER6_FINALIZATION_REPORT.md <<EOF
          # Chapter 6 Finalization Report

          Generated by the temporary Chapter 6 finalization workflow.

          ## Applied changes

          - Replaced the embedded-metadata sensitivity subsection.
          - Replaced the comparative operational robustness analysis.
          - Replaced the explainability and representative-failure-case section.
          - Replaced the operational interpretation and limitations section.
          - Updated both XAI scripts for Chapter 6 and `Max-P` terminology.

          ## Validation outcomes

          - Repository audits: ${AUDIT_OUTCOME}
          - Complete LaTeX compilation: ${COMPILE_OUTCOME}
          - LaTeX log validation: ${LOGCHECK_OUTCOME}
          - Source commit: ${GITHUB_SHA}
          EOF

          {
            echo
            echo '## Audit output (last 100 lines)'
            echo
            echo '```text'
            tail -n 100 /tmp/chapter6-audit.log 2>/dev/null || true
            echo '```'
            echo
            echo '## LaTeX diagnostics'
            echo
            echo '```text'
            if [[ -f docs/LatexThesis/main.log ]]; then
              grep -En 'Undefined references|Citation.*undefined|LaTeX Error|Package glossaries Warning|Overfull|Underfull' docs/LatexThesis/main.log | tail -n 100 || true
            else
              echo 'main.log was not produced.'
            fi
            echo '```'
          } >> docs/maintenance/CHAPTER6_FINALIZATION_REPORT.md

      - name: Remove temporary finalization resources
        if: always()
        run: |
          rm -rf tools/chapter6_finalization
          rm -f .github/workflows/chapter6-finalization.yml

      - name: Commit finalized sources and report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize Chapter 6 robustness analysis'
          git push

      - name: Upload compiled thesis and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-finalized-thesis
          if-no-files-found: warn
          path: |
            docs/LatexThesis/main.pdf
            docs/LatexThesis/main.log
            docs/maintenance/CHAPTER6_FINALIZATION_REPORT.md

      - name: Enforce successful validation
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audits.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          LOGCHECK_OUTCOME: ${{ steps.logcheck.outcome }}
        run: |
          if [[ "$AUDIT_OUTCOME" != 'success' || "$COMPILE_OUTCOME" != 'success' || "$LOGCHECK_OUTCOME" != 'success' ]]; then
            echo "Validation failed: audits=$AUDIT_OUTCOME compile=$COMPILE_OUTCOME logcheck=$LOGCHECK_OUTCOME" >&2
            exit 1
          fi
