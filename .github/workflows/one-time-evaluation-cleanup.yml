name: One-time Evaluation Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-evaluation-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas openpyxl

      - name: Patch scripts and docs
        shell: bash
        run: |
          set -euo pipefail
          cp evaluation/forensic_tools/normalized_predictions.csv /tmp/pred_before.csv
          cp results/metrics/forensic_tools_metrics.csv /tmp/metrics_before.csv
          python - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: found {text.count(old)} matches')
              return text.replace(old, new, 1)

          # Step 15: strict JSON, frozen manifests, model-agnostic metadata,
          # fail-closed sample errors, and diagnostic-output protection.
          p = Path('evaluation/scripts/15_evaluate_proxy_models.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              'path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")',
              'path.write_text(json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False) + "\\n", encoding="utf-8")',
              '15 json')
          s = one(s,
              'target_model = "model_agnostic" if attack_name == "color_shift" else "unknown"',
              'target_model = "model_agnostic" if expected_family == "anti_forensic" or attack_name == "color_shift" else "unknown"',
              '15 model agnostic')
          pattern = re.compile(r'def discover_adversarial_manifests\(manifests_dir: Path\) -> list\[Path\]:\n(?:    .*\n){1,8}?\n', re.M)
          repl = '''OFFICIAL_ADVERSARIAL_MANIFEST_NAMES = (
              "adversarial_color_shift_manifest.csv",
              "adversarial_fgsm_efficientnet_b0_manifest.csv",
              "adversarial_one_pixel_efficientnet_b0_manifest.csv",
              "adversarial_sigma_zero_efficientnet_b0_manifest.csv",
              "adversarial_superdeepfool_efficientnet_b0_manifest.csv",
          )

          def discover_adversarial_manifests(manifests_dir: Path) -> list[Path]:
              paths = [manifests_dir / name for name in OFFICIAL_ADVERSARIAL_MANIFEST_NAMES]
              missing = [path.name for path in paths if not path.is_file()]
              if missing:
                  raise FileNotFoundError(f"Missing frozen adversarial manifests: {missing}")
              return paths

          '''
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f'15 manifest discovery: {n}')
          s = one(s,
              '    parser.add_argument("--verbose", action="store_true")\n    return parser.parse_args()',
              '    parser.add_argument("--verbose", action="store_true")\n'
              '    parser.add_argument("--diagnostic-output-dir", default="")\n'
              '    return parser.parse_args()',
              '15 diagnostic arg')
          guard = '''
          def configure_output_profile(args: argparse.Namespace) -> None:
              global PROXY_EVAL_DIR, METRICS_DIR, PREDICTIONS_CSV, SUMMARY_JSON
              global FINAL_CORE_METRICS_CSV, FINAL_ROBUSTNESS_METRICS_CSV
              global FINAL_CONFUSION_MATRICES_CSV, FINAL_OOD_METRICS_CSV
              official = tuple(args.model) == DEFAULT_MODELS and args.ood_fold_mode == "all" and args.limit == 0
              if official and not args.diagnostic_output_dir:
                  return
              if not args.diagnostic_output_dir:
                  raise ValueError("Partial runs require --diagnostic-output-dir and cannot overwrite canonical outputs.")
              root = repo_relative_path(args.diagnostic_output_dir)
              PROXY_EVAL_DIR = root / "proxy_models"
              METRICS_DIR = root / "metrics"
              PREDICTIONS_CSV = PROXY_EVAL_DIR / "proxy_model_predictions.csv"
              SUMMARY_JSON = METRICS_DIR / "proxy_model_evaluation_summary.json"
              FINAL_CORE_METRICS_CSV = METRICS_DIR / "final_core_metrics.csv"
              FINAL_ROBUSTNESS_METRICS_CSV = METRICS_DIR / "final_robustness_metrics.csv"
              FINAL_CONFUSION_MATRICES_CSV = METRICS_DIR / "final_confusion_matrices.csv"
              FINAL_OOD_METRICS_CSV = METRICS_DIR / "final_ood_metrics.csv"

          '''
          s = one(s, '\ndef main() -> None:\n', '\n' + guard + 'def main() -> None:\n', '15 guard insert')
          s = one(s,
              '    args = parse_args()\n    setup_logging(args.verbose)',
              '    args = parse_args()\n    setup_logging(args.verbose)\n    configure_output_profile(args)',
              '15 guard call')
          s = one(s,
              '    df = add_clean_comparison(pd.DataFrame(rows))\n    PROXY_EVAL_DIR.mkdir',
              '    df = add_clean_comparison(pd.DataFrame(rows))\n'
              '    failed = df[df["error"].astype(str) != ""]\n'
              '    if not failed.empty:\n'
              '        raise RuntimeError("Sample-level errors detected; canonical outputs were not written.\\n" + failed.head(10).to_string(index=False))\n'
              '    PROXY_EVAL_DIR.mkdir',
              '15 fail closed')
          p.write_text(s, encoding='utf-8')

          # Step 19: minimized exported fields, unmatched audit, protected output,
          # strict JSON and optional per-tool copies.
          p = Path('evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              'path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")',
              'path.write_text(json.dumps(payload, indent=2, ensure_ascii=False, allow_nan=False) + "\\n", encoding="utf-8")',
              '19 json')
          s = one(s,
              '    parser.add_argument("--verbose", action="store_true")\n    return parser',
              '    parser.add_argument("--verbose", action="store_true")\n'
              '    parser.add_argument("--force", action="store_true")\n'
              '    parser.add_argument("--write-per-tool-files", action="store_true")\n'
              '    return parser',
              '19 args')
          old = '''    if tool_name == "magnet_axiom":
              raw_label = first_non_empty(record, {"tags"})
          elif tool_name == "griffeye":
              raw_label = extract_griffeye_bookmarks(record)
          else:
              raw_label = collect_text_fields(record, LABEL_COLUMNS)
              if not raw_label:
                  raw_label = " | ".join(safe_str(value) for value in record.values() if safe_str(value))[:1000]
          '''
          new = '''    if tool_name == "magnet_axiom":
              raw_label = first_non_empty(record, {"tags"})
          elif tool_name == "cellebrite_inseyets":
              raw_label = first_non_empty(record, {"Classifications", "Classification", "Classificazioni"})
          elif tool_name == "griffeye":
              raw_label = extract_griffeye_bookmarks(record)
          else:
              raw_label = collect_text_fields(record, LABEL_COLUMNS)
          raw_label = re.sub(r"[\\r\\n]+", " | ", safe_str(raw_label))
          raw_label = re.sub(r"\\s*\\|\\s*", " | ", raw_label).strip(" |")
          filename_or_path = basename_from_path(filename_or_path)
          '''
          s = one(s, old, new, '19 extract')
          s = one(s,
              '"raw_filename_or_path": unique_join(hit_original_paths) or base["tool_input_filename"]',
              '"raw_filename_or_path": base["tool_input_filename"]',
              '19 excire path')
          s = s.replace('extracted.setdefault("case_name", "CHIAVETTA USB")', 'extracted["case_name"] = "FAIRLAB_CELLEBRITE_INSEYETS_RUN_01"')
          marker = '    return {\n        "tool_name": row_tool_name or tool_name,'
          defaults = '''    if tool_name == "magnet_axiom":
              extracted.update({"tool_version": "10.1.0.48673", "tool_build": "Magnet AXIOM Process / Magnet.AI", "case_name": "FAIRLAB_AXIOM_RUN_02", "export_status": "completed", "ai_modules_enabled": "Magnet.AI media analysis: Weapons"})
          elif tool_name == "excire_foto_2025":
              extracted.update({"tool_version": "4.1.5", "tool_build": "Excire Foto 2025", "case_name": (selected_run_dirs or [Path("FAIRLAB_EXCIRE")])[0].name, "export_status": "completed", "ai_modules_enabled": "semantic text search with fixed firearm prompts"})

          '''
          s = one(s, marker, defaults + marker, '19 version defaults')
          s = one(s,
              '    normalized_predictions_path = output_dir / "normalized_predictions.csv"\n    export_audit_path',
              '    normalized_predictions_path = output_dir / "normalized_predictions.csv"\n'
              '    unmatched_predictions_path = output_dir / "unmatched_predictions.csv"\n'
              '    export_audit_path',
              '19 unmatched path')
          s = one(s,
              '    forensic_tool_metrics_path = metrics_dir / "forensic_tools_metrics.csv"\n\n    logging.info',
              '    forensic_tool_metrics_path = metrics_dir / "forensic_tools_metrics.csv"\n'
              '    canonical = output_dir.resolve() == DEFAULT_OUTPUT_DIR.resolve() and metrics_dir.resolve() == DEFAULT_METRICS_DIR.resolve()\n'
              '    if canonical and set(tools) != set(KNOWN_TOOL_NAMES):\n'
              '        raise ValueError("Partial tool selections require alternative output directories.")\n'
              '    if (normalized_predictions_path.exists() or forensic_tool_metrics_path.exists()) and not args.force:\n'
              '        raise FileExistsError("Outputs already exist; use --force for intentional regeneration.")\n\n'
              '    logging.info',
              '19 guard')
          s = one(s,
              '    normalized_rows = deduplicate_predictions(normalized_before_deduplication) if deduplicate else normalized_before_deduplication\n    metrics_rows',
              '    unmatched_rows = [row for row in normalized_before_deduplication if row.get("matched") != "true" or not row.get("bundle_id")]\n'
              '    normalized_rows = deduplicate_predictions(normalized_before_deduplication) if deduplicate else normalized_before_deduplication\n'
              '    if canonical:\n'
              '        counts = {name: sum(row.get("tool_name") == name for row in normalized_rows) for name in {row.get("tool_name") for row in normalized_rows}}\n'
              '        if len(normalized_rows) != 69000 or set(counts) != {"magnet_axiom", "excire_foto_2025_d20", "excire_foto_2025_d50", "excire_foto_2025_d80", "cellebrite_inseyets", "griffeye"} or any(value != 11500 for value in counts.values()):\n'
              '            raise ValueError(f"Incomplete canonical output: {counts}, total={len(normalized_rows)}")\n'
              '        if any(row.get("weapon_detected") == "unknown" for row in normalized_rows):\n'
              '            raise ValueError("Canonical output contains unknown predictions")\n'
              '    metrics_rows',
              '19 unmatched collect')
          s = one(s,
              '    write_csv(normalized_predictions_path, normalized_rows)\n    write_csv(export_audit_path',
              '    write_csv(normalized_predictions_path, normalized_rows)\n'
              '    write_csv(unmatched_predictions_path, unmatched_rows)\n'
              '    write_csv(export_audit_path',
              '19 unmatched write')
          s = one(s,
              '        if tool_rows:\n            write_csv(output_dir / f"{output_tool_name}_normalized_predictions.csv", tool_rows)',
              '        if tool_rows and args.write_per_tool_files:\n            write_csv(output_dir / f"{output_tool_name}_normalized_predictions.csv", tool_rows)',
              '19 per tool')
          s = one(s,
              '        "matched_rows_before_deduplication": matched_before,\n        "deduplication_enabled"',
              '        "matched_rows_before_deduplication": matched_before,\n'
              '        "unmatched_rows_before_deduplication": len(unmatched_rows),\n'
              '        "unmatched_rows_by_tool": {name: sum(row.get("tool_name") == name for row in unmatched_rows) for name in sorted({row.get("tool_name") for row in unmatched_rows}) if name},\n'
              '        "deduplication_enabled"',
              '19 summary counts')
          s = one(s,
              '"normalized_predictions": repo_relative_string(normalized_predictions_path),\n            "tool_export_audit"',
              '"normalized_predictions": repo_relative_string(normalized_predictions_path),\n'
              '            "unmatched_predictions": repo_relative_string(unmatched_predictions_path),\n'
              '            "tool_export_audit"',
              '19 summary output')
          p.write_text(s, encoding='utf-8')

          Path('evaluation/README.md').write_text('''# Evaluation

This directory contains the frozen evaluation layer. Transparent proxy-model
inference and commercial black-box normalization remain separate until outputs
are mapped to the hidden forensic-bundle manifest.

## Structure

```text
evaluation/
├── README.md
├── scripts/
│   ├── 15_evaluate_proxy_models.py
│   └── 19_normalize_forensic_ai_tool_predictions.py
├── proxy_models/proxy_model_predictions.csv
└── forensic_tools/
    ├── normalized_predictions.csv
    ├── unmatched_predictions.csv
    ├── tool_export_audit.csv
    ├── tool_version_log.csv
    └── normalization_summary.json
```

## Controlled-data boundary

Image corpora are not distributed on `main`. Restore the authorized dataset and
regenerate the local image trees before running step 15 or importing the blind
bundle into commercial software. Manifests, predictions, audit records and
metrics remain publicly inspectable.

## Proxy evaluation

`evaluation/scripts/15_evaluate_proxy_models.py` evaluates EfficientNet-B0,
ResNet18 and the CLIP binary-head proxy on 1,000 clean, 500 OOD, 5,000
adversarial and 5,000 anti-forensic samples. Binary items use their fold-matched
checkpoint; the 500 OOD images are evaluated with all five checkpoints.

Canonical outputs are `evaluation/proxy_models/proxy_model_predictions.csv` and
the proxy/final metric files under `results/metrics/`. Partial or limited runs
must use `--diagnostic-output-dir` and cannot replace canonical files.

## Commercial-tool normalization

`evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py` covers Magnet
AXIOM / Magnet.AI 10.1.0.48673, Excire Foto 2025 4.1.5 at D20/D50/D80,
Cellebrite Inseyets 10.9, and Griffeye 26.2.108 with T3K CORE 1.18.0.

The frozen aggregate contains six configurations and 69,000 matched predictions
(`6 × 11,500`). `normalized_predictions.csv` is the canonical prediction-level
artifact. `unmatched_predictions.csv` preserves exported rows not belonging to
the official blind bundle; those rows are excluded from metrics. Public rows
retain only anonymized filenames and the minimum observable classification data.

Canonical outputs are protected from partial overwrites. Exploratory runs must
use alternative `--output-dir` and `--metrics-dir` values. `--force` is reserved
for intentional regeneration. Per-tool prediction copies are optional through
`--write-per-tool-files`.

The only valid bridge to hidden ground truth is
`datasets/forensic_evaluation_bundle/metadata/bundle_manifest.csv`. Commercial
binary metrics cover 11,000 items; OOD behavior is reported separately over 500
items. XAI applies only to transparent proxy models under `explainability/`.
''', encoding='utf-8')

          gi = Path('.gitignore')
          text = gi.read_text(encoding='utf-8')
          if 'evaluation/forensic_tools/*_normalized_predictions.csv' not in text:
              gi.write_text(text.rstrip() + '\n\n# Optional per-tool prediction copies; aggregate output is canonical\nevaluation/forensic_tools/*_normalized_predictions.csv\n!evaluation/forensic_tools/normalized_predictions.csv\n', encoding='utf-8')
          PY
          python -m py_compile evaluation/scripts/15_evaluate_proxy_models.py evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py

      - name: Regenerate and validate normalization
        shell: bash
        run: |
          set -euo pipefail
          python evaluation/scripts/19_normalize_forensic_ai_tool_predictions.py \
            --no-interactive --strict --force \
            --tools magnet_axiom excire_foto_2025 cellebrite_inseyets griffeye \
            --selected-run-dir \
              forensic_tools/magnet_axiom/raw_exports/FAIRLAB_AXIOM_RUN_02 \
              forensic_tools/excire_foto_2025/raw_exports/FAIRLAB_EXCIRE_D20_FIREARM_PROMPTS \
              forensic_tools/excire_foto_2025/raw_exports/FAIRLAB_EXCIRE_D50_FIREARM_PROMPTS \
              forensic_tools/excire_foto_2025/raw_exports/FAIRLAB_EXCIRE_D80_FIREARM_PROMPTS \
              forensic_tools/cellebrite_inseyets/raw_exports/FAIRLAB_CELLEBRITE_INSEYETS_RUN_01 \
              forensic_tools/griffeye/raw_exports/FAIRLAB_GRIFFEYE_T3_RUN_01
          python - <<'PY'
          import json, re
          from pathlib import Path
          import pandas as pd

          oldm = pd.read_csv('/tmp/metrics_before.csv', dtype=str, keep_default_na=False)
          newm = pd.read_csv('results/metrics/forensic_tools_metrics.csv', dtype=str, keep_default_na=False)
          pd.testing.assert_frame_equal(oldm, newm, check_dtype=False)

          keys = ['tool_name','bundle_id','weapon_detected','normalized_prediction','correct','false_negative','false_positive']
          oldp = pd.read_csv('/tmp/pred_before.csv', dtype=str, keep_default_na=False)[keys].sort_values(['tool_name','bundle_id']).reset_index(drop=True)
          newp = pd.read_csv('evaluation/forensic_tools/normalized_predictions.csv', dtype=str, keep_default_na=False)[keys].sort_values(['tool_name','bundle_id']).reset_index(drop=True)
          pd.testing.assert_frame_equal(oldp, newp, check_dtype=False)
          assert len(newp) == 69000

          full = pd.read_csv('evaluation/forensic_tools/normalized_predictions.csv', dtype=str, keep_default_na=False)
          assert full['raw_filename_or_path'].map(lambda value: '/' not in value and '\\' not in value).all()
          cb = full.loc[full.tool_name.eq('cellebrite_inseyets'), 'tool_raw_label']
          assert not cb.str.contains(r'SERENA/|Percorso file:|Offset dati:|Header offset:|Original size:', regex=True).any()

          unmatched = pd.read_csv('evaluation/forensic_tools/unmatched_predictions.csv', dtype=str, keep_default_na=False)
          assert len(unmatched) == 329 and set(unmatched.tool_name) == {'cellebrite_inseyets'}
          summary = json.loads(Path('evaluation/forensic_tools/normalization_summary.json').read_text())
          assert summary['unmatched_rows_before_deduplication'] == 329
          assert summary['unmatched_rows_by_tool'] == {'cellebrite_inseyets': 329}
          assert summary['metric_output_validation']['all_metric_outputs_consistent'] is True
          PY

          rm -f evaluation/forensic_tools/{magnet_axiom,excire_foto_2025_d20,excire_foto_2025_d50,excire_foto_2025_d80,cellebrite_inseyets,griffeye}_normalized_predictions.csv
          if git diff --name-only | grep -E '\.(jpg|jpeg|png|webp|bmp|gif|tif|tiff|pt|pth|ckpt|safetensors)$'; then exit 1; fi
          if git diff --name-only | grep -E '^(datasets/(final|splits|forensic_evaluation_bundle/metadata)/|attacks/manifests/|models/checkpoints/|docs/LatexThesis/)'; then exit 1; fi
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-evaluation-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'evaluation: harden and minimize frozen outputs'
          git push origin main
