name: One-time Models Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-models-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Consolidate models artifact
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          # ------------------------------------------------------------------
          # Move and rewrite the model card.
          # ------------------------------------------------------------------
          source_card = root / "MODEL_CARD.md"
          target_card = root / "models" / "MODEL_CARD.md"
          if source_card.exists():
              target_card.parent.mkdir(parents=True, exist_ok=True)
              source_card.replace(target_card)

          target_card.write_text(
              """# Model Card

## Model Suite

**FAIR-Lab Proxy Models for Forensic Image Robustness Evaluation**

This card documents the transparent proxy models used in the MSc thesis
repository. They are experimental instruments for controlled robustness
assessment, not commercial forensic tools or operational weapon detectors.

## Task

Binary image classification:

```text
0 = non_weapon
1 = weapon
```

The `ood` category is excluded from training and from model-dependent attack
generation. It is evaluated separately as an operational stress condition.

## Models

| Name | Architecture | Training role |
|---|---|---|
| `resnet18` | `torchvision.resnet18`, ImageNet initialization | Supervised CNN baseline |
| `efficientnet_b0` | `torchvision.efficientnet_b0`, ImageNet initialization | Primary supervised CNN and adversarial target |
| `clip` | `open_clip` ViT-B/32 visual encoder plus binary head | Frozen visual encoder with trained binary head |

The CLIP checkpoints contain only the trained binary head. Reconstructing the
complete CLIP proxy also requires the external `open_clip` ViT-B/32 weights
identified as `openai` in the registry.

## Training data and fold protocol

Training uses the clean binary split manifest:

```text
datasets/splits/manifests/clean_folds_manifest.csv
```

For each target fold, the corresponding checkpoint is trained on the other four
folds. The official record contains 15 checkpoints:

```text
3 models x 5 held-out folds
```

Each run uses 680 training images, 120 internal validation images, and a
200-image held-out fold. This prevents model-dependent attacks from using a
checkpoint trained on the same fold later attacked or evaluated.

## Frozen training configuration

| Parameter | Value |
|---|---:|
| Epochs | 10 |
| CNN batch size | 16 |
| CLIP-head batch size | 32 |
| Learning rate | 0.0001 |
| Weight decay | 0.0001 |
| Internal validation ratio | 0.15 |
| Seed | 42 |
| Input size | 224 x 224 |

ResNet18 and EfficientNet-B0 are fine-tuned from ImageNet initialization unless
`--freeze-backbone` is explicitly supplied. The CLIP visual encoder is always
frozen; only its binary head is trained.

## Checkpoints and integrity

Checkpoint pattern:

```text
models/checkpoints/<model_name>/<fold>.pt
```

The checkpoints are distributed through Git LFS. Their SHA256 identifiers and
training timestamps are recorded in:

```text
models/model_registry.json
models/reports/proxy_model_training_summary.csv
```

The training script validates the official split files and their SHA256 hashes
before training. Re-running one model/fold updates only that report record and
preserves the remaining frozen records.

## Evaluation

Official evaluation entry point:

```text
evaluation/scripts/15_evaluate_proxy_models.py
```

Evaluation conditions:

```text
clean
ood
adversarial
anti_forensic
```

### Clean baseline

| Model | Accuracy | FNR | FPR |
|---|---:|---:|---:|
| `efficientnet_b0` | 0.978 | 0.016 | 0.028 |
| `resnet18` | 0.964 | 0.030 | 0.042 |
| `clip` | 0.927 | 0.012 | 0.134 |

### OOD behavior

| Model | OOD weapon rate | Mean confidence | High-confidence rate |
|---|---:|---:|---:|
| `efficientnet_b0` | 0.3696 | 0.8505 | 0.5008 |
| `resnet18` | 0.4376 | 0.8896 | 0.6468 |
| `clip` | 0.8356 | 0.5358 | 0.0000 |

The OOD table aggregates 2,500 predictions per model: the same 500 clean OOD
images are evaluated with each of the five fold-specific checkpoints. It does
not represent 2,500 distinct OOD images. Clean binary metrics instead contain
one fold-matched prediction for each of the 1,000 binary samples.

## Adversarial and anti-forensic role

EfficientNet-B0 is the primary target for model-dependent adversarial attacks.
ResNet18 and CLIP support cross-model and transferability analysis. Color Shift
and the anti-forensic transformations are model-agnostic.

## Explainability boundary

Integrated Gradients is applied to transparent proxy models, primarily
EfficientNet-B0, for qualitative diagnostic case studies. Proxy attribution maps
must not be interpreted as explanations of the commercial black-box systems:

- Magnet AXIOM / Magnet.AI;
- Excire Foto 2025;
- Cellebrite Inseyets;
- Griffeye / T3K CORE.

## Intended use

The proxy models support:

- controlled academic robustness experiments;
- fold-aware adversarial generation;
- comparison with black-box forensic AI behavior;
- qualitative explainability analysis;
- traceable methodological evaluation.

They are not intended for autonomous evidentiary decisions, operational law
enforcement deployment, real-time surveillance, biometric analysis, or
replacement of human forensic review.

## Limitations

- The models are trained on a thesis-specific and controlled-access dataset.
- The binary task does not represent all weapon categories or forensic contexts.
- OOD samples are deliberately heterogeneous and are not a supervised third class.
- Confidence values are not forensic certainty and may be poorly calibrated.
- The attack suite is selective rather than exhaustive.
- Results depend on the frozen dataset, folds, checkpoints, software environment,
  and perturbation parameters.

## Citation

Citation metadata for the repository and thesis are maintained in
[`CITATION.cff`](../CITATION.cff).
""",
              encoding="utf-8",
          )

          # ------------------------------------------------------------------
          # Rewrite the directory README.
          # ------------------------------------------------------------------
          (root / "models" / "README.md").write_text(
              """# Proxy Models

This directory contains the transparent proxy-model artifact used by the
FAIR-Lab thesis experiments. The models are research instruments for controlled
robustness evaluation and are not commercial forensic tools.

See [`MODEL_CARD.md`](MODEL_CARD.md) for the complete scope, limitations, and
reported baseline behavior.

## Structure

```text
models/
├── README.md
├── MODEL_CARD.md
├── model_registry.json
├── checkpoints/
│   ├── resnet18/fold_1.pt ... fold_5.pt
│   ├── efficientnet_b0/fold_1.pt ... fold_5.pt
│   └── clip/fold_1.pt ... fold_5.pt
├── reports/
│   └── proxy_model_training_summary.csv
└── scripts/
    └── 12_train_proxy_models.py
```

## Task and protocol

```text
0 = non_weapon
1 = weapon
```

OOD samples are excluded from training. For every target fold, the checkpoint is
trained on the other four folds. The complete frozen suite therefore contains 15
checkpoints: three models across five held-out folds.

| Model | Implementation | Checkpoint contents |
|---|---|---|
| `resnet18` | ImageNet-initialized `torchvision.resnet18` | Complete binary classifier |
| `efficientnet_b0` | ImageNet-initialized `torchvision.efficientnet_b0` | Complete binary classifier |
| `clip` | `open_clip` ViT-B/32 | Trained binary head only; external base weights required |

## Controlled-data prerequisite

Image corpora are not tracked on `main`. Before training, obtain authorized
access to the raw bundle and regenerate the clean split files through steps
00-11. The canonical split manifest remains:

```text
datasets/splits/manifests/clean_folds_manifest.csv
```

## Training

Official entry point:

```bash
python models/scripts/12_train_proxy_models.py
```

Frozen full-suite command:

```bash
python models/scripts/12_train_proxy_models.py \
  --model resnet18 efficientnet_b0 clip \
  --fold all \
  --epochs 10 \
  --batch-size 16 \
  --learning-rate 0.0001 \
  --weight-decay 0.0001 \
  --validation-ratio 0.15 \
  --seed 42 \
  --device auto \
  --input-size 224 \
  --num-workers 2 \
  --force
```

The interactive launcher is available when the script is run without arguments.
For CLIP, the visual encoder is always frozen and only the binary head is trained.
The `--freeze-backbone` option affects only ResNet18 and EfficientNet-B0.

Before training, the script validates image presence, fold/class balance,
identifier uniqueness, and SHA256 correspondence with the split manifest.
Training report updates use an upsert keyed by `model_name + fold`, preventing a
partial rerun from deleting records for the other checkpoints.

## Registry, reports, and checkpoints

```text
models/model_registry.json
models/reports/proxy_model_training_summary.csv
models/checkpoints/<model_name>/<fold>.pt
```

The registry stores architecture metadata, checkpoint paths, SHA256 identifiers,
and training timestamps. Checkpoints are tracked through Git LFS; no public
image corpus is required to inspect their recorded identities.

Official evaluation entry point:

```text
evaluation/scripts/15_evaluate_proxy_models.py
```
""",
              encoding="utf-8",
          )

          # ------------------------------------------------------------------
          # Update model registry metadata without changing hashes.
          # ------------------------------------------------------------------
          registry_path = root / "models" / "model_registry.json"
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          registry["training_script"] = "models/scripts/12_train_proxy_models.py"
          registry["training_report"] = "models/reports/proxy_model_training_summary.csv"
          registry["checkpoint_distribution"] = "git_lfs"
          for name, entry in registry.get("models", {}).items():
              entry.pop("download_url", None)
              entry["checkpoint_distribution"] = "git_lfs"
              if name == "clip":
                  entry["external_base_weights_required"] = True
                  entry["external_base_model"] = "open_clip.ViT-B-32"
                  entry["external_base_weights"] = "openai"
          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # ------------------------------------------------------------------
          # Patch the training script.
          # ------------------------------------------------------------------
          script_path = root / "models" / "scripts" / "12_train_proxy_models.py"
          script = script_path.read_text(encoding="utf-8")

          script = script.replace(
              'help="Freeze CNN backbone and train only the classifier head.",',
              'help=(\n            "Freeze the ResNet18/EfficientNet-B0 backbone and train only the "\n            "classifier head. The CLIP visual encoder is always frozen."\n        ),',
          )

          old_resnet = '''    if model_name == "resnet18":\n        try:\n            weights = models.ResNet18_Weights.IMAGENET1K_V1\n        except AttributeError:\n            weights = None\n        model = models.resnet18(weights=weights)\n'''
          new_resnet = '''    if model_name == "resnet18":\n        try:\n            weights = models.ResNet18_Weights.IMAGENET1K_V1\n        except AttributeError as exc:\n            raise RuntimeError(\n                "The installed torchvision version does not expose "\n                "ResNet18_Weights.IMAGENET1K_V1. Refusing to fall back to random "\n                "initialization because it would change the frozen protocol."\n            ) from exc\n        model = models.resnet18(weights=weights)\n'''
          if old_resnet not in script:
              raise RuntimeError("ResNet18 builder pattern not found")
          script = script.replace(old_resnet, new_resnet)

          old_eff = '''    if model_name == "efficientnet_b0":\n        try:\n            weights = models.EfficientNet_B0_Weights.IMAGENET1K_V1\n        except AttributeError:\n            weights = None\n        model = models.efficientnet_b0(weights=weights)\n'''
          new_eff = '''    if model_name == "efficientnet_b0":\n        try:\n            weights = models.EfficientNet_B0_Weights.IMAGENET1K_V1\n        except AttributeError as exc:\n            raise RuntimeError(\n                "The installed torchvision version does not expose "\n                "EfficientNet_B0_Weights.IMAGENET1K_V1. Refusing to fall back to "\n                "random initialization because it would change the frozen protocol."\n            ) from exc\n        model = models.efficientnet_b0(weights=weights)\n'''
          if old_eff not in script:
              raise RuntimeError("EfficientNet builder pattern not found")
          script = script.replace(old_eff, new_eff)

          marker = "\ndef split_train_validation(\n"
          validation_function = '''\ndef validate_manifest_files(df: pd.DataFrame) -> None:\n    """Validate the frozen split manifest and all locally restored image files."""\n    duplicate_ids = df.loc[df["image_id"].duplicated(), "image_id"].tolist()\n    if duplicate_ids:\n        raise ValueError(\n            f"Duplicate image_id values in split manifest: {duplicate_ids[:10]}"\n        )\n\n    expected_folds = [f"fold_{index}" for index in range(1, 6)]\n    actual_folds = sorted(df["fold"].unique().tolist())\n    if actual_folds != expected_folds:\n        raise ValueError(\n            f"Unexpected fold set. Expected {expected_folds}, found {actual_folds}."\n        )\n\n    grouped = df.groupby(["fold", "final_label"]).size()\n    unexpected_counts: list[str] = []\n    for fold in expected_folds:\n        for label in VALID_LABELS:\n            count = int(grouped.get((fold, label), 0))\n            if count != 100:\n                unexpected_counts.append(f"{fold}/{label}={count}")\n    if unexpected_counts:\n        raise ValueError(\n            "The official split must contain 100 samples per class and fold. "\n            f"Unexpected counts: {unexpected_counts}"\n        )\n\n    missing_files: list[str] = []\n    hash_mismatches: list[str] = []\n    for row in df.itertuples(index=False):\n        image_path = resolve_repo_path(safe_str(row.split_relative_path))\n        if not image_path.is_file():\n            missing_files.append(repo_relative_string(image_path))\n            continue\n        expected_sha256 = safe_str(row.sha256).lower()\n        actual_sha256 = compute_sha256(image_path).lower()\n        if actual_sha256 != expected_sha256:\n            hash_mismatches.append(\n                f"{row.image_id}: expected {expected_sha256}, found {actual_sha256}"\n            )\n\n    if missing_files:\n        raise FileNotFoundError(\n            "Split image files are missing. Restore the controlled-access dataset "\n            "and regenerate step 11 before training. First missing paths: "\n            f"{missing_files[:10]}"\n        )\n    if hash_mismatches:\n        raise ValueError(\n            "Split image SHA256 verification failed. First mismatches: "\n            f"{hash_mismatches[:10]}"\n        )\n\n\n'''
          if "def validate_manifest_files(" not in script:
              if marker not in script:
                  raise RuntimeError("split_train_validation marker not found")
              script = script.replace(marker, validation_function + "def split_train_validation(\n", 1)

          report_start = script.index("def write_training_report(")
          report_end = script.index("\ndef update_registry(", report_start)
          new_report_function = '''def write_training_report(records: list[dict[str, Any]]) -> Path:\n    """Upsert model/fold records without discarding previous training runs."""\n    TRAINING_REPORTS_DIR.mkdir(parents=True, exist_ok=True)\n    report_path = TRAINING_REPORTS_DIR / "proxy_model_training_summary.csv"\n\n    fieldnames = [\n        "model_name",\n        "fold",\n        "checkpoint_path",\n        "checkpoint_sha256",\n        "train_images",\n        "validation_images",\n        "holdout_images",\n        "best_validation_accuracy",\n        "last_epoch",\n        "created_at",\n    ]\n\n    merged: dict[tuple[str, str], dict[str, Any]] = {}\n    if report_path.exists():\n        with report_path.open("r", newline="", encoding="utf-8") as f:\n            reader = csv.DictReader(f)\n            if reader.fieldnames != fieldnames:\n                raise ValueError(\n                    f"Unexpected training-report schema: {reader.fieldnames}"\n                )\n            for row in reader:\n                key = (safe_str(row["model_name"]), safe_str(row["fold"]))\n                merged[key] = dict(row)\n\n    for record in records:\n        row = dict(record)\n        row["last_epoch"] = json.dumps(\n            row.get("last_epoch", {}), sort_keys=True, allow_nan=False\n        )\n        key = (safe_str(row["model_name"]), safe_str(row["fold"]))\n        merged[key] = row\n\n    model_order = {name: index for index, name in enumerate(SUPPORTED_MODELS)}\n    fold_order = {f"fold_{index}": index for index in range(1, 6)}\n    ordered_rows = sorted(\n        merged.values(),\n        key=lambda row: (\n            model_order.get(safe_str(row["model_name"]), len(model_order)),\n            fold_order.get(safe_str(row["fold"]), 999),\n        ),\n    )\n\n    with report_path.open("w", newline="", encoding="utf-8") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames)\n        writer.writeheader()\n        writer.writerows(ordered_rows)\n\n    return report_path\n\n'''
          script = script[:report_start] + new_report_function + script[report_end + 1:]

          load_call = "    df = load_manifest(manifest_path)\n"
          replacement = (
              "    df = load_manifest(manifest_path)\n"
              "    logging.info(\"Validating split files and SHA256 hashes before training\")\n"
              "    validate_manifest_files(df)\n"
          )
          if replacement not in script:
              if load_call not in script:
                  raise RuntimeError("Manifest load call not found")
              script = script.replace(load_call, replacement, 1)

          script_path.write_text(script, encoding="utf-8")

          # ------------------------------------------------------------------
          # Update references to the relocated card.
          # ------------------------------------------------------------------
          text_suffixes = {".md", ".tex", ".yml", ".yaml", ".txt", ".py", ".json"}
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path in {target_card, root / "models" / "README.md"}:
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = re.sub(r"(?<!models/)MODEL_CARD\.md", "models/MODEL_CARD.md", content)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")

          gitkeep = root / "models" / "checkpoints" / ".gitkeep"
          if gitkeep.exists():
              gitkeep.unlink()
          PY

      - name: Validate models artifact
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile models/scripts/12_train_proxy_models.py

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          registry = json.loads(Path('models/model_registry.json').read_text(encoding='utf-8'))
          assert registry['training_script'] == 'models/scripts/12_train_proxy_models.py'
          assert registry['training_report'] == 'models/reports/proxy_model_training_summary.csv'
          assert registry['checkpoint_distribution'] == 'git_lfs'

          models = registry['models']
          assert set(models) == {'resnet18', 'efficientnet_b0', 'clip'}
          assert models['clip']['external_base_weights_required'] is True

          with Path('models/reports/proxy_model_training_summary.csv').open(
              newline='', encoding='utf-8'
          ) as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 15, len(rows)
          assert len({(row['model_name'], row['fold']) for row in rows}) == 15

          report_hashes = {
              (row['model_name'], row['fold']): row['checkpoint_sha256']
              for row in rows
          }

          for model_name, entry in models.items():
              assert entry['checkpoint_distribution'] == 'git_lfs'
              assert 'download_url' not in entry
              assert set(entry['sha256']) == {
                  'fold_1', 'fold_2', 'fold_3', 'fold_4', 'fold_5'
              }
              for fold, expected in entry['sha256'].items():
                  checkpoint = Path(entry['checkpoint_pattern'].format(fold=fold))
                  assert checkpoint.is_file(), checkpoint
                  raw = checkpoint.read_bytes()
                  pointer_prefix = b'version https://git-lfs.github.com/spec/v1\n'
                  if raw.startswith(pointer_prefix):
                      lines = raw.decode('utf-8').splitlines()
                      oid = next(line.split(':', 1)[1] for line in lines if line.startswith('oid sha256:'))
                      actual = oid
                  else:
                      import hashlib
                      actual = hashlib.sha256(raw).hexdigest()
                  assert actual == expected, (checkpoint, actual, expected)
                  assert report_hashes[(model_name, fold)] == expected

          assert Path('models/MODEL_CARD.md').is_file()
          assert not Path('MODEL_CARD.md').exists()
          assert not Path('models/checkpoints/.gitkeep').exists()
          PY

          if git diff --name-only -- models/checkpoints | grep -Ev '^models/checkpoints/\.gitkeep$' | grep -q .; then
            echo 'Checkpoint modification detected; refusing to commit.' >&2
            git diff --name-only -- models/checkpoints >&2
            exit 1
          fi

          if git grep -nE 'X-Ways/Excire|Cellebrite UFED|Oxygen Forensic Detective' -- models README.md REPOSITORY_MAP.md docs 2>/dev/null; then
            echo 'Obsolete commercial-tool references remain in the model documentation.' >&2
            exit 1
          fi

          if git grep -n 'Citation details will be added upon thesis completion' -- models 2>/dev/null; then
            echo 'Provisional model-card citation remains.' >&2
            exit 1
          fi

          if git grep -nE '(^|[^/])MODEL_CARD\.md' -- '*.md' '*.tex' 2>/dev/null | grep -v 'models/MODEL_CARD.md' | grep -v 'models/README.md'; then
            echo 'Stale MODEL_CARD.md reference remains.' >&2
            exit 1
          fi

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-models-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'models: consolidate proxy model artifact'
          git push origin HEAD:main
